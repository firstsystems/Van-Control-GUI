# Van Control GUI settings

[serial]
# Leave empty to pick the first /dev/cu.usbserial-* or /dev/cu.usbmodem-* port.
port = ""
poll_interval_s = 1.0

# Function names for the outputs. Key = name the firmware uses (connector pin).
# Shown as "PUMP (BLK7-5)". Outputs not listed here show just the pin name.
[labels]
"BLK7-5"  = "PUMP"
"BLK6-3"  = "SPARE"
"BLK4-3"  = "OUTSIDE"
"BLK4-15" = "LIGHT3"
"BLK4-9"  = "LIGHT2"
"BLK4-6"  = "LIGHT1"
"12V_HS1" = "CRITICAL"
"12V_HS2" = "NON_CRITICAL"

# The momentary button: sends <output>_TOGGLE, same as pressing PB5.
[toggle_button]
output = "BLK4-3"
label = "PB5 toggle"

# Analogue scaling. Firmware 1.1+ reports VLB and VSB as battery mV, already
# calibrated, so their ratio stays 1.0. TEMP is still mV at the MCU pin (0-3300).
#   kind = "divider": value = reported volts x ratio
#   kind = "linear":  value = (reported mV - offset_mV) / mV_per_unit
#
# The temperature settings are PLACEHOLDERS - replace with the real sensor details.
[analog.VLB]
label = "Leisure battery"
unit = "V"
decimals = 2
kind = "divider"
ratio = 1.0

[analog.VSB]
label = "Starter battery"
unit = "V"
decimals = 2
kind = "divider"
ratio = 1.0

# Assumes a TMP36-style sensor (500 mV at 0 °C, 10 mV/°C).
[analog.TEMP]
label = "Temperature"
unit = "°C"
decimals = 1
kind = "linear"
offset_mV = 500
mV_per_unit = 10
